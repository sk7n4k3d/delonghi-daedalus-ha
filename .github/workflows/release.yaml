name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same guards as upstream delonghi-ha release.yaml (issue #10 / #52):
      # a tag that disagrees with the manifest fails loudly instead of
      # shipping a quiet lie, and the published zip must carry the version
      # we just validated.
      - name: Verify tag matches manifest.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(jq -r .version custom_components/delonghi_daedalus/manifest.json)
          EXPECTED_TAG="v${MANIFEST_VERSION}"
          echo "manifest.json version : ${MANIFEST_VERSION}"
          echo "git tag               : ${TAG}"
          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::tag '${TAG}' does not match manifest version '${MANIFEST_VERSION}' (expected '${EXPECTED_TAG}'). Bump manifest.json before tagging." >&2
            exit 1
          fi
          echo "tag and manifest agree on ${MANIFEST_VERSION}"

      - name: Build release zip
        run: |
          cd custom_components/delonghi_daedalus
          zip -r ../../delonghi_daedalus.zip .

      - name: Verify zip carries the expected manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zipverify
          unzip -o delonghi_daedalus.zip -d /tmp/zipverify > /dev/null
          ZIP_VERSION=$(jq -r .version /tmp/zipverify/manifest.json)
          EXPECTED_TAG="v${ZIP_VERSION}"
          echo "zipped manifest.json version : ${ZIP_VERSION}"
          echo "git tag                      : ${TAG}"
          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::zip manifest version '${ZIP_VERSION}' does not match tag '${TAG}'." >&2
            exit 1
          fi
          rm -rf /tmp/zipverify

      - name: Detect prerelease from tag
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # SemVer 2.0: anything after `MAJOR.MINOR.PATCH-` is a prerelease
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected PRERELEASE tag: $TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected STABLE tag: $TAG"
          else
            echo "::error::Tag does not match SemVer pattern vX.Y.Z[-suffix]" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          generate_release_notes: true
          files: delonghi_daedalus.zip
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease.outputs.is_prerelease == 'false' }}
